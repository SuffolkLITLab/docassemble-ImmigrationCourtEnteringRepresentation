    is_primary_attorney_or_represenative = True
    is_non_primary_attorney_or_representative = False
    is_on_behalf_of_attorney = False
  elif attorney_rep_variable == "acting_on_behalf":
    is_primary_attorney_or_represenative = False
    is_non_primary_attorney_or_representative = False
    is_on_behalf_of_attorney = True
  elif attorney_rep_variable == "non_primary_attorney":
    is_primary_attorney_or_represenative = False
    is_non_primary_attorney_or_representative = True
    is_on_behalf_of_attorney = False
  if not is_on_behalf_of_attorney:
    agent_represented_attorney_name = ""
    on_behalf_of_date = None
