id: Attorney or Representative Entrance
question: |
  Representation details
subquestion: |
  Tell us whether you are entering an appearance or appearing as an EOIR-ordered qualified representative. Also provide your EOIR ID number and confirm if you are providing this representation pro bono.
fields:
  - Select One: attorney_or_rep_variable
    datatype: radio
    choices:
      - "Entered as Attorney or Representative for the Party named": entered_as_rep
      - "Appearing as EOIR Ordered Qualified Representative for the Party Named": eoir_appointed
  - "EOIR ID Number": eoir_id
  - "Representation is Pro Bono": is_providing_pro_bono
    datatype: yesno
---
code: |
  if is_providing_pro_bono:
    is_not_providing_pro_bono = False
  else:
    is_not_providing_pro_bono = True
  if attorney_or_rep_variable == "entered_as_rep":
    is_entered_as_attorney = True
    is_ordered_qualified_representative = False
  elif attorney_or_rep_variable == "eoir_appointed":
    is_entered_as_attorney = False
    is_ordered_qualified_representative = True
---
id: Attorney or Representative Role
question: |
  Representation details
subquestion: |
  Select whether you are the primary, non-primary, or appearing on behalf of another attorney/representative.
fields:
  - Select one: attorney_rep_variable
    datatype: radio
    help: |
      You must designate primary or non-primary unless you are appearing in an “on behalf of” capacity for another attorney for a specific hearing. Only the primary attorney/representative will receive mailings from the Immigration Court. All attorneys/representatives regardless of type of appearance are practitioners of record and are individually responsible as representatives for the respondent. Circumstances may arise that require the Immigration Court to designate a primary and/or switch service of mailings from the primary to a non-primary.
    choices:
      - "Primary Attorney or Representative": primary_attorney
      - "Non-primary Attorney or Representative": non_primary_attorney
      - "Acting on Behalf of an Attorney for this Hearing": acting_on_behalf
---
code: |
