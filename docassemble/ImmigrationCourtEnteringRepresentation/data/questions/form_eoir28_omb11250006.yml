---
id: Form_EOIR28_omb11250006
continue button field: form_eoir28_omb11250006_intro
question: |
  Notice of Entry of Appearance (Form EOIR-28)
subquestion: |
  This interview helps you fill out Form EOIR-28 to enter an appearance in an Immigration Court case.

  Before you start, gather:

  1. The represented party’s name, address, and A-number
  1. The Immigration Court location
  1. Your EOIR ID number
  1. Your contact and firm/organization information

  When you are finished, you will sign and file the form with the Immigration Court.

  Most people take about 20 minutes to complete this interview.
---
id: Can I file a notice of entry
question: |
  Can I file a notice of entry?
subquestion: |
  Use this form only for cases in Immigration Court. If your case is before the Board of Immigration Appeals (BIA), use Form EOIR-27 instead.
fields:
  - "Is this for a case in Immigration Court?": is_immigration_court_case
    datatype: yesnoradio
  - "Are you an attorney or someone else allowed to represent someone in Immigration Court?": is_authorized_representative
    datatype: yesnoradio
    under text: |
      This includes EOIR-accredited representatives, law students or graduates (with supervision), reputable individuals without pay, accredited foreign government officials, and people authorized to practice before December 23, 1952.
---
id: not_eligible_notice_of_entry
event: not_eligible_notice_of_entry
question: |
  Can I file a notice of entry?
subquestion: |
  % if not is_immigration_court_case:
  This form is only for Immigration Court cases. If your case is before the Board of Immigration Appeals (BIA), use Form EOIR-27 instead.

  You can find EOIR forms at:
  https://www.justice.gov/eoir/list-downloadable-eoir-forms
  % endif
  % if not is_authorized_representative:

  This form is for authorized representatives only. If you are not allowed to represent someone in Immigration Court, you should not file Form EOIR-28.

  Learn more about EOIR appearance rules at:
  https://www.justice.gov/eoir
  % endif
buttons:
  - Start over: restart
  - Exit: exit
---
id: Represented Party Name
question: |
  Represented Party Information
subquestion: |
  Provide information about the party to be represented.
fields:
  - "First Name": party1_name_first
    maxlength: 24
  - "Middle Initial": party1_name_middle_initial
    maxlength: 8
    required: False
  - "Last Name": party1_name_last
    maxlength: 30
  - "Alien Number": alien_number
    maxlength: 23
---
id: Represented Party Address
question: |
  Represented Party Information
subquestion: |
  Provide information about the party to be represented.
fields:
  - "Street Address": party1_address_line_one
    maxlength: 44
  - "Unit": party1_address_unit
    maxlength: 18
    required: False
  - "City": party1_address_city
    maxlength: 35
  - "Zip Code": party1_address_zip
    maxlength: 21
  - "State": party1_address_state
    maxlength: 6
---
id: Entry of Appearance
question: |
  Entry of Appearance
subquestion: |
  Which proceedings are you entering?
fields:
  - Select One: proceeding_variable
    datatype: radio
    required: True
    choices:
      - All Proceedings: all_proceedings
      - Custody and Bond Proceedings Only: custody_and_bond
      - All Proceedings Other Than Custody And Bond Proceedings: not_custody_and_bond
---
code: |
  if proceeding_variable == "all_proceedings":
    is_all_proceedings = True
    is_custody_and_bond_proceeding = False
    is_all_but_custody_and_bond_proceeding = False
  elif proceeding_variable == "custody_and_bond":
    is_all_proceedings = False
    is_custody_and_bond_proceeding = True
    is_all_but_custody_and_bond_proceeding = False
  elif proceeding_variable == "not_custody_and_bond":
    is_all_proceedings = False
    is_custody_and_bond_proceeding = False
    is_all_but_custody_and_bond_proceeding = True
  else:
    is_all_proceedings = False
    is_custody_and_bond_proceeding = False
    is_all_but_custody_and_bond_proceeding = False
---
id: Attorney or Representative Qualification
question: |
  Attorney or Representative Qualification
subquestion: |
  Select the basis that qualifies you to represent the party in this case.
fields:
  - Select One That Describes You: representation_variable
    datatype: radio
    choices:
      - "Eligible Attorney": rep_attorney
        help: |
          I am an attorney eligible to practice law in, and a member in good standing of, the bar of 
          the highest courts of the following states, possessions, territories, 
          commonwealths, or the District of Columbia, and I am not subject to any order disbarring, 
          suspending, enjoining, restraining or otherwise restricting me in the practice of law in 
          any jurisdiction (if subject to such an order, do not check this box and explain in 
          additional information 
          section).
      - "Accredited Representative": rep_representative
        help: |
          I am a representative accredited to appear before the Executive Office for Immigration Review as defined in 8 C.F.R. § 1292.1(a)(4)
      - "Law Student or Graduate": rep_student
        help: |
          I am a law student or law graduate of an accredited U.S. law school as defined in 8 C.F.R. § 1292.1(a)(2)
      - "Reputable Individual": rep_individual
        help: |
          I am a reputable individual as defined in 8 C.F.R. § 1292.1(a)(3) and I am appearing without direct or indirect remuneration. I am providing further information in the Additional Information section
      - "Accredited Foreign Government Official": rep_official
        help: |
          I am an accredited foreign government official, as defined in 8 C.F.R. § 1291.1(a)(5)
      - "Authorized to practice on December 23, 1952": rep_practice
        help: |
          I am a person who was authorized to practice on December 23, 1952, under 8 C.F.R. § 1292.1(b)
---
code: |
  if representation_variable == "rep_attorney":
    is_attorney = True
    is_accredited_representative = False
    is_law_student_or_graduate = False
    is_reputable_individual = False
    is_foreign_official = False
    is_authorized_to_practice = False
    do_further_information = True
  elif representation_variable == "rep_representative":
    is_attorney = False
    is_accredited_representative = True
    is_law_student_or_graduate = False
    is_reputable_individual = False
    is_foreign_official = False
    is_authorized_to_practice = False
    do_further_information = True
  elif representation_variable == "rep_student":
    is_attorney = False
    is_accredited_representative = False
    is_law_student_or_graduate = True
    is_reputable_individual = False
    is_foreign_official = False
    is_authorized_to_practice = False
    do_further_information = False
  elif representation_variable == "rep_individual":
    is_attorney = False
    is_accredited_representative = False
    is_law_student_or_graduate = False
    is_reputable_individual = True
    is_foreign_official = False
    is_authorized_to_practice = False
    do_further_information = False
  elif representation_variable == "rep_official":
    is_attorney = False
    is_accredited_representative = False
    is_law_student_or_graduate = False
    is_reputable_individual = False
    is_foreign_official = True
    is_authorized_to_practice = False
    do_further_information = True
  elif representation_variable == "rep_practice":
    is_attorney = False
    is_accredited_representative = False
    is_law_student_or_graduate = False
    is_reputable_individual = False
    is_foreign_official = False
    is_authorized_to_practice = True
    do_further_information = False
  else:
    is_attorney = False
    is_accredited_representative = False
    is_law_student_or_graduate = False
    is_reputable_individual = False
    is_foreign_official = False
    is_authorized_to_practice = False
    do_further_information = False
---
id: Qualification Information
question: |
  More information about your qualifications
fields:
  - "Full Name of Court": full_court_name
    help: |
      Provide the Official Name of the Immigration Court where the hearing is scheduled
    maxlength: 28
    required: False
    show if:
      code: |
        is_attorney
  - "Bar Number (if applicable)": bar_number
    help: |
      Provide your bar number if you are an eligible attorney
    maxlength: 22
    required: False
    show if:
      code: |
        is_attorney
  - "Represented Organization": represented_organization
    help: |
      Provide the name of your organization if you are an accredited representative defined in 8 C.F.R. § 1292.1(a)(4)
    maxlength: 45
    required: False
    show if:
      code: |
        is_accredited_representative
  - "Country": represented_country
    help: |
      Provide the name of your country if you are an accredited government official, as defined in 8 C.F.R. § 1291.1(a)(5)
    maxlength: 16
    required: False
    show if:
      code: |
        is_foreign_official
---
code: |
  if not is_attorney:
    full_court_name = ""
    bar_number = ""
  if not is_accredited_representative:
    represented_organization = ""
  if not is_foreign_official:
    represented_country = ""
